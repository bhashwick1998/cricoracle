services:
  # -------------------------------------------------------------
  # CricOracle Backend API (FastAPI + Ingestion Engine + ML Levers)
  # -------------------------------------------------------------
  - type: web
    name: cricoracle-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000

  # -------------------------------------------------------------
  # CricOracle Frontend Console (Next.js 16 + React 19 + Tailwind)
  # -------------------------------------------------------------
  - type: web
    name: cricoracle-frontend
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start -- -p $PORT
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: BACKEND_URL
        fromService:
          type: web
          name: cricoracle-backend
          property: host
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: cricoracle-backend
          property: host
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
