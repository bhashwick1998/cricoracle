services:
  # -------------------------------------------------------------
  # CricOracle Backend API (FastAPI + Ingestion Engine + ML Levers)
  # Single free service uses <= 744 hrs/mo (fits inside 750 free hrs/mo)
  # Put Cloudflare Free CDN (orange cloud) in front for s-maxage=15 caching
  # Host frontend/ on Vercel Hobby or Cloudflare Pages to avoid 2x hour & proxy burn
  # -------------------------------------------------------------
  - type: web
    name: cricoracle-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: CRICAPI_KEY_PAID
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: RENDER_CACHE_REFRESH_HOURS
        value: "12"
      - key: CRICSHEET_CACHE_REFRESH_HOURS
        value: "24"
