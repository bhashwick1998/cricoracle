services:
  # -------------------------------------------------------------
  # CricOracle Backend API (FastAPI + Ingestion Engine + ML Levers)
  # -------------------------------------------------------------
  - type: web
    name: cricoracle-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000

  # -------------------------------------------------------------
  # CricOracle Frontend Console (Next.js 16 + React 19 + Tailwind)
  # -------------------------------------------------------------
  - type: web
    name: cricoracle-frontend
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && NODE_OPTIONS="--experimental-require-module" npm run build
    startCommand: npm start -- -p $PORT
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_OPTIONS
        value: --experimental-require-module
      - key: BACKEND_URL
        value: https://cricoracle-backend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://cricoracle-backend.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://cricoracle-frontend.onrender.com
